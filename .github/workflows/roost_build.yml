# Roost Print for Windows: builds the app on GitHub's Windows machines and keeps the result as a
# download (a zip: unzip it anywhere and run RoostPrint.exe).
#
# Two jobs: the libraries it needs (an hour or two the first time, then kept in the cache until
# something in deps/ changes), then the app itself (about half an hour). Run it from the Actions
# tab ("Run workflow"), or push to main. Tagging a version (v1.0.0) also makes a GitHub Release.
#
# Each build step keeps its full output in a log file; if a step fails, its last lines are posted
# as an error note on the run, so the reason shows on the run page.
name: Build Roost Print

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'doc/**', 'Creality_doc/**']
  workflow_dispatch:

concurrency:
  group: roost-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DEPS_DIR: ${{ github.workspace }}/deps/build/OrcaSlicer_dep

jobs:
  deps:
    name: Libraries
    # Visual Studio 2022 (the build scripts ask for it by name).
    runs-on: windows-2022
    timeout-minutes: 340
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        shell: pwsh
        run: '"key=roost-win-deps-${{ hashFiles(''deps/**'') }}" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8'

      - name: Already built?
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_DIR }}
          key: ${{ steps.key.outputs.key }}

      - uses: lukka/get-cmake@latest
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cmakeVersion: "~3.28.0"

      - name: Build the libraries
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install strawberryperl -y --no-progress | Out-Null
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:PATH"
          & tools/roost/ci_run.ps1 -Log deps.log -Command 'call test_build.bat deps' -Check "$env:DEPS_DIR/usr/local"

  app:
    name: Roost Print
    needs: deps
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: The libraries
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_DIR }}
          key: ${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - uses: microsoft/setup-msbuild@v2

      - name: Get the WebView2 runtime installer (shipped with the app)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/runtime | Out-Null
          Invoke-WebRequest -Uri https://github.com/CrealityOfficial/CrealityPrint/releases/download/tools/MicrosoftEdgeWebView2RuntimeInstallerX64.exe -OutFile package/runtime/MicrosoftEdgeWebView2RuntimeInstallerX64.exe

      - name: Build Roost Print
        shell: pwsh
        env:
          WindowsSdkDir: 'C:\Program Files (x86)\Windows Kits\10\'
          WindowsSDKVersion: '10.0.22000.0\'
        run: '& tools/roost/ci_run.ps1 -Log app.log -Command "call test_build.bat slicer" -Check build/OrcaSlicer/RoostPrint.exe'

      - name: Pack it up
        shell: pwsh
        run: |
          $out = "build/OrcaSlicer"
          Copy-Item tools/roost/README-download.txt "$out/READ ME.txt"
          $name = "RoostPrint-Windows-$(Get-Date -Format 'yyyyMMdd')-$($env:GITHUB_SHA.Substring(0,7)).zip"
          Compress-Archive -Path "$out/*" -DestinationPath $name
          "ZIP=$name" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: RoostPrint-Windows
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          name: Roost Print ${{ github.ref_name }}
