# Puts a finished build up as a GitHub Release, so it downloads without signing in to GitHub
# (build downloads under Actions need a GitHub login). Run it from the Actions tab with the
# number of a successful "Build Roost Print" run.
name: Publish a build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Number of the successful build run
        required: true
      tag:
        description: Release tag, e.g. build-1f842e5
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoostPrint-Windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - name: Zip and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" out/*.zip \
            -R "${{ github.repository }}" --prerelease \
            --title "Roost Print ${{ inputs.tag }}" \
            --notes "Unzip anywhere and run RoostPrint.exe. Built by run ${{ inputs.run_id }}."
